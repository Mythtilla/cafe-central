<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" role="img" aria-labelledby="facadeTitle">
  <title id="facadeTitle">The Café Central façade on Rua 21 de Agosto</title>

  <defs>
    <linearGradient id="fWall" x1="320" y1="24" x2="320" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3E9D6"/>
      <stop offset=".6" stop-color="#E9DCC3"/>
      <stop offset="1" stop-color="#DCCCB0"/>
    </linearGradient>
    <linearGradient id="fGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7D08A"/>
      <stop offset=".55" stop-color="#D99A46"/>
      <stop offset="1" stop-color="#8E5A22"/>
    </linearGradient>
    <linearGradient id="fShop" x1="320" y1="286" x2="320" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#234136"/>
      <stop offset="1" stop-color="#15271F"/>
    </linearGradient>
    <linearGradient id="fBrass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4C489"/>
      <stop offset=".5" stop-color="#B08A45"/>
      <stop offset="1" stop-color="#7B5A22"/>
    </linearGradient>
    <pattern id="fSlats" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 8L8 0" stroke="#6E2A19" stroke-opacity=".28" stroke-width="1.4"/>
    </pattern>
    <pattern id="azulejo" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#F1E8D6"/>
      <rect x=".5" y=".5" width="13" height="13" fill="none" stroke="#2E5C8A" stroke-opacity=".5"/>
      <path d="M7 2.5 11.5 7 7 11.5 2.5 7Z" fill="#2E5C8A" fill-opacity=".48"/>
      <circle cx="7" cy="7" r="1.4" fill="#F1E8D6" fill-opacity=".8"/>
    </pattern>
    <pattern id="calcada" width="34" height="14" patternUnits="userSpaceOnUse">
      <rect width="34" height="14" fill="#EADDC5"/>
      <path d="M0 7q8.5-7 17 0t17 0" fill="none" stroke="#2A1D13" stroke-opacity=".26" stroke-width="2"/>
      <path d="M-17 14q8.5-7 17 0t17 0t17 0" fill="none" stroke="#2A1D13" stroke-opacity=".18" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- building shell -->
  <rect x="36" y="24" width="568" height="428" fill="url(#fWall)" stroke="#2A1D13" stroke-width="2"/>
  <rect x="24" y="18" width="592" height="14" fill="#D9C7A7" stroke="#2A1D13" stroke-width="2"/>
  <rect x="36" y="52" width="568" height="10" fill="#CBB795" stroke="#2A1D13" stroke-width="1.4"/>
  <g fill="#CBB795" stroke="#2A1D13" stroke-width="1">
    <rect x="52" y="62" width="12" height="8"/><rect x="88" y="62" width="12" height="8"/>
    <rect x="124" y="62" width="12" height="8"/><rect x="160" y="62" width="12" height="8"/>
    <rect x="196" y="62" width="12" height="8"/><rect x="232" y="62" width="12" height="8"/>
    <rect x="268" y="62" width="12" height="8"/><rect x="304" y="62" width="12" height="8"/>
    <rect x="340" y="62" width="12" height="8"/><rect x="376" y="62" width="12" height="8"/>
    <rect x="412" y="62" width="12" height="8"/><rect x="448" y="62" width="12" height="8"/>
    <rect x="484" y="62" width="12" height="8"/><rect x="520" y="62" width="12" height="8"/>
    <rect x="556" y="62" width="12" height="8"/>
  </g>

  <!-- azulejo frieze under the cornice -->
  <rect x="40" y="72" width="568" height="14" fill="url(#azulejo)" opacity=".9"/>
  <path d="M36 72h572M36 86h572" stroke="#2A1D13" stroke-opacity=".45" stroke-width="1"/>

  <!-- upper windows -->
  <g>
    <!-- left -->
    <rect x="96" y="92" width="104" height="110" fill="#3A2A1B" stroke="#2A1D13" stroke-width="1.4"/>
    <rect x="104" y="100" width="88" height="94" fill="url(#fGlass)" opacity=".85"/>
    <path d="M148 100v94M104 147h88" stroke="#3A2A1B" stroke-width="3"/>
    <rect x="80" y="92" width="16" height="110" fill="#A6462C" stroke="#6E2A19" stroke-width="1.2"/>
    <rect x="80" y="92" width="16" height="110" fill="url(#fSlats)"/>
    <rect x="200" y="92" width="16" height="110" fill="#A6462C" stroke="#6E2A19" stroke-width="1.2"/>
    <rect x="200" y="92" width="16" height="110" fill="url(#fSlats)"/>
    <rect x="80" y="202" width="136" height="6" fill="#CBB795" stroke="#2A1D13" stroke-width="1"/>

    <!-- centre with balcony -->
    <rect x="280" y="92" width="104" height="110" fill="#3A2A1B" stroke="#2A1D13" stroke-width="1.4"/>
    <rect x="288" y="100" width="88" height="94" fill="url(#fGlass)" opacity=".8"/>
    <path d="M332 100v94M288 147h88" stroke="#3A2A1B" stroke-width="3"/>
    <rect x="264" y="92" width="16" height="110" fill="#A6462C" stroke="#6E2A19" stroke-width="1.2"/>
    <rect x="264" y="92" width="16" height="110" fill="url(#fSlats)"/>
    <rect x="384" y="92" width="16" height="110" fill="#A6462C" stroke="#6E2A19" stroke-width="1.2"/>
    <rect x="384" y="92" width="16" height="110" fill="url(#fSlats)"/>
    <rect x="264" y="202" width="136" height="6" fill="#CBB795" stroke="#2A1D13" stroke-width="1"/>
    <g stroke="#2A1D13" stroke-width="1.6">
      <path d="M282 208h100M282 214h100"/>
      <path d="M290 208v22M308 208v22M326 208v22M344 208v22M362 208v22M380 208v22"/>
    </g>

    <!-- right -->
    <rect x="464" y="92" width="104" height="110" fill="#3A2A1B" stroke="#2A1D13" stroke-width="1.4"/>
    <rect x="472" y="100" width="88" height="94" fill="url(#fGlass)" opacity=".85"/>
    <path d="M516 100v94M472 147h88" stroke="#3A2A1B" stroke-width="3"/>
    <rect x="448" y="92" width="16" height="110" fill="#A6462C" stroke="#6E2A19" stroke-width="1.2"/>
    <rect x="448" y="92" width="16" height="110" fill="url(#fSlats)"/>
    <rect x="568" y="92" width="16" height="110" fill="#A6462C" stroke="#6E2A19" stroke-width="1.2"/>
    <rect x="568" y="92" width="16" height="110" fill="url(#fSlats)"/>
    <rect x="448" y="202" width="136" height="6" fill="#CBB795" stroke="#2A1D13" stroke-width="1"/>
  </g>

  <!-- sign band -->
  <rect x="58" y="222" width="524" height="64" fill="#1B2E25" stroke="#2A1D13" stroke-width="2"/>
  <rect x="64" y="228" width="512" height="52" fill="none" stroke="url(#fBrass)" stroke-width="1.4"/>
  <text x="320" y="257" text-anchor="middle" fill="#D8B26C" font-family="Fraunces, Georgia, serif" font-size="29" letter-spacing="5" font-weight="500">CAFÉ CENTRAL</text>
  <text x="320" y="273" text-anchor="middle" fill="#D8B26C" fill-opacity=".78" font-family="Inter Tight, system-ui, sans-serif" font-size="7.4" letter-spacing="3.4" font-weight="500">VISEU · DESDE 1955</text>

  <!-- shopfront -->
  <rect x="58" y="286" width="524" height="154" fill="url(#fShop)" stroke="#2A1D13" stroke-width="2"/>

  <!-- left window -->
  <path d="M86 316c0-10 12-18 30-18h76c18 0 30 8 30 18v104H86Z" fill="#0E1A15" stroke="#2A1D13" stroke-width="1.6"/>
  <path d="M94 318c0-8 10-13 24-13h72c14 0 24 5 24 13v96H94Z" fill="url(#fGlass)"/>
  <path d="M154 305v109M94 362h120" stroke="#1B2E25" stroke-width="4"/>
  <path d="M94 362h120" stroke="#2A1D13" stroke-opacity=".35" stroke-width="1"/>
  <g fill="#1B2E25">
    <path d="M114 396c8-10 18-6 18 4v12h-18Z" opacity=".55"/>
    <circle cx="188" cy="336" r="7" opacity=".4"/>
  </g>

  <!-- right window -->
  <path d="M398 316c0-10 12-18 30-18h76c18 0 30 8 30 18v104H398Z" fill="#0E1A15" stroke="#2A1D13" stroke-width="1.6"/>
  <path d="M406 318c0-8 10-13 24-13h72c14 0 24 5 24 13v96H406Z" fill="url(#fGlass)"/>
  <path d="M466 305v109M406 362h120" stroke="#1B2E25" stroke-width="4"/>
  <path d="M406 362h120" stroke="#2A1D13" stroke-opacity=".35" stroke-width="1"/>
  <g fill="#1B2E25">
    <ellipse cx="506" cy="402" rx="13" ry="9" opacity=".5"/>
    <path d="M426 400c8-12 20-8 20 4v8h-20Z" opacity=".5"/>
  </g>

  <!-- door -->
  <rect x="278" y="316" width="84" height="124" fill="#101D17" stroke="#2A1D13" stroke-width="2"/>
  <rect x="286" y="324" width="68" height="56" fill="url(#fGlass)"/>
  <rect x="286" y="388" width="68" height="44" fill="#1E362C" stroke="#2A1D13" stroke-width="1.2"/>
  <path d="M320 324v108" stroke="#2A1D13" stroke-width="1.6"/>
  <circle cx="312" cy="402" r="3.4" fill="#D8B26C" stroke="#7B5A22"/>
  <circle cx="328" cy="402" r="3.4" fill="#D8B26C" stroke="#7B5A22"/>
  <path d="M286 324h68" stroke="#D8B26C" stroke-opacity=".5" stroke-width="2"/>

  <!-- brass date plaque -->
  <g>
    <rect x="368" y="320" width="24" height="13" rx="1" fill="url(#fBrass)" stroke="#6E4A18" stroke-width=".8"/>
    <text x="380" y="329.2" text-anchor="middle" font-family="Inter Tight, system-ui, sans-serif" font-size="5.6" letter-spacing=".6" font-weight="600" fill="#3A2A0E">1955</text>
  </g>

  <!-- step + plants -->
  <rect x="58" y="440" width="524" height="12" fill="#C4AF8D" stroke="#2A1D13" stroke-width="1.4"/>
  <g stroke="#2A1D13" stroke-width="1.4">
    <path d="M248 440v-20h20v20" fill="#9F5836"/>
    <path d="M372 440v-20h20v20" fill="#9F5836"/>
    <path d="M258 420c-8-14 4-24 0-32M258 420c8-12-2-22 2-30M258 420c0-16 10-20 12-28" stroke="#2F5138" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M382 420c-8-14 4-24 0-32M382 420c8-12-2-22 2-30M382 420c0-16 10-20 12-28" stroke="#2F5138" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- wall lamp -->
  <g>
    <path d="M320 286v-14" stroke="#2A1D13" stroke-width="2"/>
    <path d="M306 272h28l-5 10h-18Z" fill="#D8B26C" stroke="#7B5A22" stroke-width="1.2"/>
    <circle cx="320" cy="284" r="3" fill="#FFE2AC"/>
  </g>

  <!-- calçada portuguesa -->
  <rect x="0" y="452" width="640" height="28" fill="url(#calcada)"/>
  <path d="M0 452h640" stroke="#2A1D13" stroke-opacity=".3" stroke-width="1"/>

  <!-- pavement shadow -->
  <ellipse cx="320" cy="458" rx="290" ry="10" fill="#2A1D13" opacity=".14"/>
</svg>
